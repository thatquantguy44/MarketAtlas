[source_database]
host = "localhost"
port = 55432
database = "macro_medallion"
username = "replace-me"
password = "replace-me"

# Source discovery and adapters always open read-only transactions.
read_only = true
role = "marketatlas_source_reader"

[upstream_asset]
# MacroMedallion and EcoMedallion refer to the same upstream asset. This
# optional local checkout is for discovery/lineage only; MarketAtlas never
# imports its code or requires a remote URL, commit, or branch pin.
# local_repository_path = "/absolute/path/to/EcoMedallion"

[target_database]
host = "localhost"
port = 55432
database = "macro_medallion"
username = "replace-me"
password = "replace-me"
role = "marketatlas_writer"

# Optional Power BI export connection. Use a dedicated login able to assume
# only marketatlas_report_reader; no source or writer access is required.
[report_database]
host = "localhost"
port = 55432
database = "macro_medallion"
username = "replace-me"
password = "replace-me"
role = "marketatlas_report_reader"
