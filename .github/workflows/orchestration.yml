name: Dagster orchestration contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/market_atlas/**'
      - 'tests/**'
      - 'configs/**'
      - 'orchestration/**'
      - 'scripts/dagster-*.sh'
      - 'scripts/*report*.sh'
      - 'scripts/refresh-browser-report.py'
      - 'services/dagster-supervisor.mjs'
      - 'powerbi/browser/**'
      - 'pyproject.toml'
      - 'requirements-orchestration.lock'
      - '.github/workflows/orchestration.yml'
permissions:
  contents: read
jobs:
  dagster-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-orchestration.lock
      - run: python -m pip check
      - name: Check local service and report launchers
        run: |
          bash -n scripts/dagster-dev.sh scripts/dagster-service.sh scripts/report-preview.sh scripts/build-browser-report.sh
          node --check services/dagster-supervisor.mjs
          node --test tests/browser-analytics.test.mjs
      - name: Test definitions, schedules, sequencing, retries and fixture exports
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
