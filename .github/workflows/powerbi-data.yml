name: Power BI synthetic data pack
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/market_atlas/**'
      - 'tests/**'
      - 'powerbi/**'
      - '.github/workflows/powerbi-data.yml'
permissions:
  contents: read
jobs:
  synthetic-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test credential-free contracts
        env:
          PYTHONPATH: src
        run: python -S -m unittest discover -s tests -v
      - name: Generate and validate a synthetic pack
        env:
          PYTHONPATH: src
        run: |
          python -S -m market_atlas powerbi export --output data/generated/powerbi > /tmp/powerbi-export.json
          python -S - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          result = json.loads(Path('/tmp/powerbi-export.json').read_text())
          subprocess.run([sys.executable, '-S', '-m', 'market_atlas', 'powerbi', 'validate', '--input', result['pack']], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marketatlas-powerbi-synthetic
          path: |
            data/generated/powerbi/
            powerbi/queries/
            powerbi/guides/
          retention-days: 14
          if-no-files-found: error
