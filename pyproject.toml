[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-atlas"
version = "0.0.1"
description = "MarketAtlas synthetic fixture and contract foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3,<4"]
orchestration = ["dagster==1.13.27", "dagster-webserver==1.13.27", "psycopg[binary]>=3.3,<4"]

[project.scripts]
market-atlas = "market_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "market_atlas.orchestration.definitions"
